experiment:
  name: fc_hopping
  seed: 42


route:
  file: ../dataset/route/region_1_21_60s_2mps_list.json

channel:
  NF_dB: 7.0
  N0_dBm_per_Hz: -174
  measure_time: 0.05  # in seconds
  rho_max: 4.8
  alpha: 0.6
  rand_seed: 20250920

  case: "SISO"

tx:
  n_tx: 2
  array_size: [1, 1]
  vertical_spacing: 0.5
  horizontal_spacing: 0.5
  pos: [[-290.0,50.0,10.0],[52.0,142.0,10.0]]
  look_at_pos : [[-280.0,100.0,1.0],[52.0, 150.0,1.0]]
  pattern: "tr38901"
  polarization: "V"
  display_radius: 20

  power_dbm: [51, 51]



ue:
  n_ue: 2
  initial_pos: [[-290.0,50.0,1.0], [-290.0,100.0,1.0]] # Initial position of the UE
  initial_orientation: [[0.0,0.0], [0.0,0.0]] # Initial orientation of the UE (yaw, pitch)
  min_speed: 0
  max_speed: 2
  body_model: "UE2.ply"
  body_material: "metal"
  scaling: [1, 1]  # Scaling factor for the UE model

  R_speed_level: 1 


  n_rx: 4
  rx_id: [0, 1, 2, 3]
  rx_array_size: [1, 1]
  vertical_spacing: 0.5
  horizontal_spacing: 0.5

  # rx_loc: ["top_left","bottom_right", "center_right", "center_left"]
  rx_loc_pos: [[-0.036,0.075,0], [0.036,-0.075,0], [0.036,0,0], [-0.036,0,0]] # Relative position of the RXs to the UE center (top_left, bottom_right, center_right, center_left)
  rx_loc_orientation: [[2.35619449019, 0, 0],[-0.78539816339, 0, 0],[0,0,0],[0,0,0]] # Initial orientation of the RXs (yaw, pitch, roll)
  rx_loc_orientation_deg: [[135, 0, 0],[-45, 0, 0],[0,0,0],[0,0,0]] # Initial orientation of the RXs (yaw, pitch, roll) in degrees
  rx_pattern: ["patch", "patch", "dipole", "dipole"]
  polarization: "V"
  # rx_pattern: ["tr38901", "tr38901", "tr38901", "tr38901"]
  rx_display_radius: [1, 1, 1, 1]


  rx_fc: [15.0e9, 15.0e9, 3.5e9, 3.5e9]
  rx_bw: [200.0e6, 200.0e6, 100.0e6, 100.0e6]

rt:
  cir_out_type: "numpy"
  max_depth: 5
  los: True
  specular_reflection: True
  diffraction: False
  edge_diffraction: False
  refraction: True
  diffuse_reflection: True



dataset:
  raw: /dataset/dataset_raw
