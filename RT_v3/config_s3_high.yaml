experiment:
  name: fc_hopping
  seed: 42

  CQI_dir: "../dataset/CQI_Mobility_high_R_2_region_3"
scene:
  # name: "free_space"
  name: "nyu_tandon"

route:

  folder: "../dataset/route/route_Mobility_high_R_2_region_3"
  n_routes: 1000

channel:
  NF_dB: 7.0
  N0_dBm_per_Hz: -174
  measure_time: 0.05  # in seconds
  rho_max: 4.8
  alpha: 0.6
  rand_seed: 20250920

  case: "SISO"

