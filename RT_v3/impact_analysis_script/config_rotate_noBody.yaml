experiment:
  name: fc_hopping
  seed: 42


route:
  file: ../dataset/route/region_1_21_60s_2mps_list.json

channel:
  NF_dB: 7.0
  N0_dBm_per_Hz: -174
  measure_time: 0.05  # in seconds
  rho_max: 4.8
  alpha: 0.6
  rand_seed: 20250920

  case: "SISO"

tx:
  n_tx: 1
  array_size: [1, 1]
  vertical_spacing: 0.5
  horizontal_spacing: 0.5
  # pos: [[-290.0,50.0,10.0],[52.0,142.0,10.0]]


  pos: [[0, 0, 0]]
  look_at_pos : [[0, 5.0,0.0]]



  pattern: "tr38901"
  polarization: "V"
  display_radius: 20

  power_dbm: [51]

###############################################
# medium mobility
###############################################
motion:
  measure_period: 0.05  # in seconds
  measure_time: 60.0  # in seconds
  max_speed: 5.0
  min_speed: 0.0
  dv_min: -2.0
  dv_max: 2.0
  dphi_min: -30.0
  dphi_max: 30.0

  v_intial: 2.0
  R_speed_level: 1.0

  rand_seed: 42

# ###############################################
# # high mobility
# ###############################################
# motion:
#   measure_period: 0.05  # in seconds
#   measure_time: 60.0  # in seconds
#   max_speed: 10.0
#   min_speed: 0.0
#   dv_min: -5.0
#   dv_max: 5.0
#   dphi_min: -20.0
#   dphi_max: 20.0

#   v_intial: 3.0
#   R_speed_level: 2

#   rand_seed: 42

  # region 1
  # region: [[-467.028, 105.999, 1], [-339.867, 105.999, 1], [-467.028, -170.559, 1], [-339.867, -170.559, 1]]

  # region 2
  region: [[-286.686, 146.815, 1], [-286.686, 301.179, 1], [-108.376,146.815, 1], [-108.376, 301.179, 1]]
  collision_margin: 0.3



ue:
  n_ue: 1
  initial_pos: [[0, 500.0,0.0]] # Initial position of the UE

  initial_orientation_deg: [[0.0,0.0]]

  add_body: False  # Whether to add a body model to the UE
  
  min_speed: 0
  max_speed: 2
  body_model: "UE2.ply"
  body_material: "metal"
  scaling: [1]  # Scaling factor for the UE model

  R_speed_level: 1 


  n_rx: 4
  rx_id: [0, 1, 2, 3]
  rx_array_size: [1, 1]
  vertical_spacing: 0.5
  horizontal_spacing: 0.5

  # rx_loc: ["top_left","bottom_right", "center_right", "center_left"]
  rx_loc_pos: [[-0.036,0.076,0], [0.036,-0.076,0], [0.036,0,0], [-0.036,0,0]] # Relative position of the RXs to the UE center (top_left, bottom_right, center_right, center_left)

  # rx_loc_orientation: [[2.35619449019, 0, 0],[-0.78539816339, 0, 0],[0,0,0],[0,0,0]] # Initial orientation of the RXs (yaw, pitch, roll)
  rx_loc_orientation_deg: [[135, 0, 0],[45, 0, 0],[0,0,0],[0,0,0]] # Initial orientation of the RXs (yaw, pitch, roll) in degrees

  rx_pattern: ["patch", "patch", "dipole", "dipole"]
  polarization: "V"
  # rx_pattern: ["tr38901", "tr38901", "tr38901", "tr38901"]
  rx_display_radius: [1, 1, 1, 1]


  rx_fc: [15.0e9, 15.0e9, 3.5e9, 3.5e9]
  rx_bw: [200.0e6, 200.0e6, 100.0e6, 100.0e6]

rt:
  cir_out_type: "numpy"
  max_depth: 5
  los: True
  specular_reflection: True
  diffraction: False
  edge_diffraction: False
  refraction: True
  diffuse_reflection: True



dataset:
  raw: /dataset/dataset_raw
